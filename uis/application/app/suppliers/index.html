<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackFlow | Directorio de proveedores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="page">
      <header class="topbar" role="banner">
        <div>
          <p class="eyebrow">TrackFlow Backoffice</p>
          <h1>Directorio de proveedores</h1>
        </div>
        <nav aria-label="Navegacion principal" class="menu-links">
          <a href="../../../index.html">Inicio</a>
          <a href="../../../application.html">Formulario</a>
        </nav>
      </header>

      <section class="panel" aria-labelledby="filters-title">
        <div class="panel-head">
          <h2 id="filters-title">Filtros</h2>
          <p>Actualizan el listado sin recargar la pagina.</p>
        </div>
        <div class="filters-grid">
          <label>
            Pais
            <select id="countryFilter">
              <option value="">Todos</option>
              <option value="USA">USA</option>
              <option value="Spain">Spain</option>
            </select>
          </label>
          <label>
            Categoria
            <select id="categoryFilter">
              <option value="">Todas</option>
            </select>
          </label>
          <label>
            API base
            <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000" />
          </label>
          <button id="reloadBtn" class="ghost" type="button">Recargar</button>
        </div>
      </section>

      <section class="grid-two">
        <article class="panel" aria-labelledby="table-title">
          <div class="panel-head">
            <h2 id="table-title">Proveedores</h2>
            <p id="tableSummary">Cargando...</p>
          </div>
          <div class="table-wrap" role="region" aria-live="polite">
            <table>
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Pais</th>
                  <th>Categorias</th>
                  <th>Tarifa</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="suppliersBody"></tbody>
            </table>
          </div>
          <p class="feedback" id="listFeedback"></p>
        </article>

        <article class="panel" aria-labelledby="create-title">
          <div class="panel-head">
            <h2 id="create-title">Registrar proveedor</h2>
            <p>Usa POST /suppliers</p>
          </div>
          <form id="supplierForm" class="supplier-form" novalidate>
            <label>
              Nombre
              <input id="name" name="name" required />
            </label>

            <label>
              Pais
              <select id="country" name="country" required>
                <option value="">Selecciona</option>
                <option value="USA">USA</option>
                <option value="Spain">Spain</option>
              </select>
            </label>

            <label>
              Moneda
              <select id="currency" name="currency" required>
                <option value="">Selecciona</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
              </select>
            </label>

            <label>
              Categoria
              <select id="category" name="category" required></select>
            </label>

            <label>
              Tarifa por envio
              <input id="rate" name="rate" type="number" min="0.01" step="0.01" required />
            </label>

            <label>
              Estado
              <select id="status" name="status" required>
                <option value="active">active</option>
                <option value="suspended">suspended</option>
              </select>
            </label>

            <label>
              Zona de servicio (opcional)
              <input id="serviceZone" name="serviceZone" />
            </label>

            <label>
              Email de contacto (opcional)
              <input id="contactEmail" name="contactEmail" type="email" />
            </label>

            <label>
              Notas (opcional)
              <textarea id="notes" name="notes" rows="3"></textarea>
            </label>

            <button type="submit">Crear proveedor</button>
          </form>
          <p class="feedback" id="formFeedback" aria-live="polite"></p>
        </article>
      </section>
    </main>

    <script src="./suppliers.js"></script>
  </body>
</html>
