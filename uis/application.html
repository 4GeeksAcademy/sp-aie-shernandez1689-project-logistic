<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Logística - Aplicación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-3xl px-6 py-12">
      <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-slate-900">← Volver al inicio</a>

      <section class="mt-4 rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
        <h1 class="text-2xl font-bold tracking-tight">Formulario de Aplicación</h1>
        <p class="mt-2 text-slate-600">Completa los datos para enviar tu solicitud.</p>

        <form id="applicationForm" class="mt-8 space-y-5" novalidate>
          <div>
            <label for="fullName" class="mb-1 block text-sm font-semibold">Nombre completo</label>
            <input
              id="fullName"
              name="fullName"
              type="text"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none ring-0 focus:border-slate-400"
              placeholder="Ej: Ana Pérez"
            />
            <p id="fullNameError" class="mt-1 text-sm text-red-600"></p>
          </div>

          <div>
            <label for="email" class="mb-1 block text-sm font-semibold">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none ring-0 focus:border-slate-400"
              placeholder="nombre@empresa.com"
            />
            <p id="emailError" class="mt-1 text-sm text-red-600"></p>
          </div>

          <div>
            <label for="phone" class="mb-1 block text-sm font-semibold">Teléfono</label>
            <input
              id="phone"
              name="phone"
              type="tel"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none ring-0 focus:border-slate-400"
              placeholder="Ej: +56 9 1234 5678"
            />
            <p id="phoneError" class="mt-1 text-sm text-red-600"></p>
          </div>

          <div>
            <label for="role" class="mb-1 block text-sm font-semibold">Cargo de interés</label>
            <select
              id="role"
              name="role"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none ring-0 focus:border-slate-400"
            >
              <option value="">Selecciona una opción</option>
              <option value="coordinador">Coordinador Logístico</option>
              <option value="analista">Analista de Operaciones</option>
              <option value="supervisor">Supervisor de Almacén</option>
            </select>
            <p id="roleError" class="mt-1 text-sm text-red-600"></p>
          </div>

          <div>
            <label for="message" class="mb-1 block text-sm font-semibold">Mensaje</label>
            <textarea
              id="message"
              name="message"
              rows="4"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none ring-0 focus:border-slate-400"
              placeholder="Cuéntanos brevemente tu experiencia"
            ></textarea>
            <p id="messageError" class="mt-1 text-sm text-red-600"></p>
          </div>

          <div class="flex items-center gap-3">
            <button
              type="submit"
              class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-700"
            >
              Enviar solicitud
            </button>
            <p id="formSuccess" class="text-sm font-medium text-green-700"></p>
          </div>
        </form>
      </section>
    </main>

    <script src="validation.js"></script>
  </body>
</html>
