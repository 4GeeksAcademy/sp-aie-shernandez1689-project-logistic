[project]
name = "trackflow-auth-tests"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "tinydb==4.8.0",
    "pydantic>=2.12",
    "email-validator==2.2.0",
    "PyJWT==2.9.0",
    "python-dotenv==1.0.1",
    "sqlmodel>=0.0.22,<0.1.0",
    "psycopg[binary]>=3.2,<4.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "prefect>=3",
    "pandas>=2.2,<4.0",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "flower>=2.2.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
    "matplotlib>=3.11.2",
    "qdrant-client>=1.20.0",
    "openai>=3.37.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/user-api", "services/api", "."]
addopts = "--cov=app.api.auth --cov-report=term-missing --cov-fail-under=70"
